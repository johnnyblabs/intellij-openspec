org.gradle.caching=true
# Single source of truth for the plugin's TOP-supported OpenSpec CLI version. The UI-smoke workflow
# (.forgejo/workflows/ui-smoke.yaml) installs this exact CLI, and TargetVersionSingleSourceTest fails
# the build if it drifts or if no captured fixture corpus exists for it under
# src/test/resources/fixtures/cli/<version>/. Bumping this is a deliberate step with a checklist in
# CONTRIBUTING.md ("CLI version targeting & local development"). The durable historical *floor* (the
# older generations whose corpora must be retained) lives separately in
# ValidatorVerdictVersionStabilityTest.FLOOR and CliVersionAtLeastTest — do not collapse them here.
openspecTargetVersion=1.15.0
# The Kotlin plugin exists only for the uiSmoke integrationTest source set; keep its
# auto-added stdlib OFF the production classpath so it never ships in the plugin zip
# (integrationTest gets the stdlib explicitly via the Starter framework's dependencies).
kotlin.stdlib.default.dependency=false
